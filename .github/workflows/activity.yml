name: Dernières contributions

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: jamesgeorge007/github-activity-readme@master
        with:
          COMMIT_MSG: "chore: update latest contributions"
          MAX_LINES: 8
          COMMIT_NAME: "dyskolos-bot"
          COMMIT_EMAIL: "contact@dyskolos.fr"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
